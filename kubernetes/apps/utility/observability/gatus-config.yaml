---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Health Status
  header: Health Status
  logo: https://avatars.githubusercontent.com/u/46251616
  link: https://github.com/joryirving
  buttons:
    - name: Github
      link: https://github.com/joryirving
    - name: Homelab
      link: https://github.com/joryirving/home-ops
    - name: Main Status
      link: https://status.davidstewen.com
    - name: Columbina Status
      link: https://columbina-gatus.davidstewen.com

web:
  port: ${GATUS_WEB_PORT}
