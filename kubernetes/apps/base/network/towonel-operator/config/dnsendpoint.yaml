---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
# Parallel records for the Towonel VPS edge. Cloudflared's existing
# `*.davidstewen.com` DNSEndpoint is unaffected.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: towonel-edge
spec:
  endpoints:
    - dnsName: towonel.davidstewen.com
      recordType: A
      targets: ["148.113.195.107"]
      providerSpecific:
        - name: external-dns.kubernetes.io/cloudflare-proxied
          value: "false"
    - dnsName: columbina-gatus.davidstewen.com
      recordType: A
      targets: ["148.113.195.107"]
      providerSpecific:
        - name: external-dns.kubernetes.io/cloudflare-proxied
          value: "false"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: towonel-edge-external
spec:
  endpoints:
    - dnsName: ${EXTERNAL_DOMAIN}.davidstewen.com
      recordType: CNAME
      targets: ["towonel.davidstewen.com"]
      providerSpecific:
        - name: external-dns.kubernetes.io/cloudflare-proxied
          value: "false"
