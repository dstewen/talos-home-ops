---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  chartRef:
    kind: OCIRepository
    name: mc-router
  interval: 15m
  dependsOn: []
  values:
    image:
      repository: ghcr.io/itzg/mc-router
      tag: 1.53.0@sha256:864435bb8efaa61e51a5b69b4c71d945d94cc1e5604ae8efc2e02e8e3b0c668a
      pullPolicy: IfNotPresent
    services:
      minecraft:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.69.10.40
          external-dns.kubernetes.io/hostname: mc.davidstewen.com,
            takocraft.davidstewen.com, create.davidstewen.com, vibecraft.davidstewen.com,
            jellycraft.davidstewen.com, cobbleverse.davidstewen.com
          external-dns.kubernetes.io/target: towonel.davidstewen.com
          external-dns.kubernetes.io/cloudflare-proxied: "false"
          towonel.io/minecraft.public-port: "25565"
          towonel.io/minecraft.tcp: "true"
          towonel.io/tunnel: enable
          towonel.io/tunnel-ref: network/towonel-main
