---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Recipe: Qwen3-Coder-Next-FP8
# Qwen3-Coder-Next model in native FP8 format
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-coder-next-fp8
spec:
  source: hf://Qwen/Qwen3-Coder-Next-FP8
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: fp8
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      tensorParallelism: 2
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# Recipe: Qwen3-Coder-Next-FP8
# Qwen3-Coder-Next model in native FP8 format
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-coder-next-fp8
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3-coder-next-fp8
  modelCache:
    claimName: llmkube-ganyu-cache
  runtime: vllm
  image: ghcr.io/vllm-project/vllm:latest
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  contextSize: 131072
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "1000m"
    memory: "16Gi"
    nvidia.com/gpu: "2"
  endpoint:
    port: 8000
    type: ClusterIP
  extraArgs:
    - --enable-auto-tool-choice
    - --tool-call-parser qwen3_coder
    - --gpu-memory-utilization 0.8
    - --host 0.0.0.0
    - --port 8000
    - --kv-cache-dtype fp8
    - --load-format instanttensor
    - --attention-backend flashinfer
    - --enable-prefix-caching
    - --max-model-len 131072
    - --tensor-parallel-size 2
    - --distributed-executor-backend ray
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
