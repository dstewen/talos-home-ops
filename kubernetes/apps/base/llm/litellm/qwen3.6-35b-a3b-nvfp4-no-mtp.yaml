---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Model: Qwen/Qwen3.6-35B-A3B-NVFP4 (no MTP)
# Recipe: qwen3.6-35b-a3b-nvfp4-no-mtp.yaml
# Single-node TP=2, NVFP4 quantization, no speculative decoding
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen36-35b-a3b-nvfp4-no-mtp
spec:
  source: hf://Qwen/Qwen3.6-35B-A3B-NVFP4
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: nvfp4
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 2
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# InferenceService: vLLM serving with NVFP4, no MTP
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen36-35b-a3b-nvfp4-no-mtp
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen36-35b-a3b-nvfp4-no-mtp
  modelCache:
    claimName: llmkube-ganyu-cache
  runtime: vllm
  image: eugr/spark-vllm:latest
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  maxNumBatchedTokens: 4096
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "2000m"
    memory: "32Gi"
    nvidia.com/gpu: "2"
  endpoint:
    port: 8000
    type: ClusterIP
  extraArgs:
    - --host 0.0.0.0
    - --port 8000
    - --max-model-len 262144
    - --max-num-batched-tokens 4096
    - --gpu-memory-utilization 0.8
    - --enable-auto-tool-choice
    - --tool-call-parser qwen3_xml
    - --reasoning-parser qwen3
    - --kv-cache-dtype fp8
    - --load-format fastsafetensors
    - --attention-backend flashinfer
    - --tensor-parallel-size 2
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --async-scheduling
  env:
    - name: VLLM_MARLIN_USE_ATOMIC_ADD
      value: "1"
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
