---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Model: google/diffusiongemma-26B-A4B-it (thinking enabled)
# Recipe: diffusion-gemma-bf16-thinking.yaml
# Single-node TP=1, BF16 format, thinking enabled
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: diffusiongemma-bf16-thinking
spec:
  source: hf://google/diffusiongemma-26B-A4B-it
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: bf16
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# InferenceService: vLLM serving, BF16, thinking enabled
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: diffusiongemma-bf16-thinking
  labels:
    krr/ignore: "true"
spec:
  modelRef: diffusiongemma-bf16-thinking
  modelCache:
    claimName: llmkube-ganyu-cache
  runtime: vllm
  image: eugr/spark-vllm:latest
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  contextSize: 8192
  maxNumBatchedTokens: 4096
  parallelSlots: 1
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "1000m"
    memory: "32Gi"
    nvidia.com/gpu: "1"
  endpoint:
    port: 8000
    type: ClusterIP
  extraArgs:
    - --host 0.0.0.0
    - --port 8000
    - --max-model-len 8192
    - --max-num-batched-tokens 4096
    - --gpu-memory-utilization 0.8
    - --kv-cache-dtype fp8
    - --load-format fastsafetensors
    - --attention-backend flashinfer
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --async-scheduling
    - --reasoning-parser gemma4
  env:
    - name: VLLM_USE_THINKING
      value: "1"
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
