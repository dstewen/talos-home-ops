---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Recipe: nvidia/Qwen3.8-27B-NVFP4
# NVFP4 quantized with DFlash2 speculative decoding
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b-nvfp4-dflash2
spec:
  source: hf://nvidia/Qwen3.8-27B-NVFP4
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: nvfp4
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      tensorParallelism: 2
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# Recipe: nvidia/Qwen3.8-27B-NVFP4
# NVFP4 quantized with DFlash2 speculative decoding
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-27b-nvfp4-dflash2
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3.8-27b-nvfp4-dflash2
  modelCache:
    claimName: llmkube-ganyu-cache
  runtime: vllm
  image: ghcr.io/eugr/spark-vllm:latest
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  parallelSlots: 2
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "2000m"
    memory: "32Gi"
    nvidia.com/gpu: "2"
  endpoint:
    port: 8000
    type: ClusterIP
  extraArgs:
    - --trust-remote-code
    - --kv-cache-dtype fp8
    - --gpu-memory-utilization 0.8
    - --max-model-len 262144
    - --max-num-seqs 8
    - --max-num-batched-tokens 4096
    - --enable-chunked-prefill
    - --async-scheduling
    - --enable-prefix-caching
    - --speculative-config '{"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","num_speculative_tokens":8,"draft_tensor_parallel_size":2}'
    - --load-format instanttensor
    - --reasoning-parser qwen3
    - --tool-call-parser qwen3_xml
    - --enable-auto-tool-choice
    - --tensor-parallel-size 2
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
