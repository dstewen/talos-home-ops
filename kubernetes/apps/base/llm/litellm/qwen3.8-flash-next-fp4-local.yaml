---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Recipe: nvidia/Qwen3.8-Flash-Next-FP4-Local
# B12X-optimized single-node serving with PLE disk offload
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-flash-next-fp4-local
spec:
  source: hf://nvidia/Qwen3.8-Flash-Next-FP4-Local
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: fp4
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      tensorParallelism: 1
      pipelineParallelism: 1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# Recipe: nvidia/Qwen3.8-Flash-Next-FP4-Local
# B12X-optimized single-node serving with PLE disk offload
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3.8-flash-next-fp4-local
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3.8-flash-next-fp4-local
  modelCache:
    claimName: llmkube-ganyu-cache
  runtime: vllm
  image: ghcr.io/eugr/spark-vllm:b12x
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  maxNumBatchedTokens: 4096
  blocksize: 16
  parallelSlots: 1
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "1000m"
    memory: "32Gi"
    nvidia.com/gpu: "1"
  endpoint:
    port: 8000
    type: ClusterIP
  extraArgs:
    - --tensor-parallel-size 1
    - --pipeline-parallel-size 1
    - --mamba-cache-mode align
    - --enable-prefix-caching
    - --enable-chunked-prefill
    - --dtype bfloat16
    - --kv-cache-dtype fp8
    - --quantization modelopt_mixed
    - --block-size 16
    - --load-format b12x
    - --max-model-len 262144
    - --max-num-seqs 8
    - --max-num-batched-tokens 4096
    - --speculative-config '{"method":"mtp","num_speculative_tokens":4}'
    - --gdn-decode-kernel b12x
    - --linear-backend b12x
    - --moe-backend b12x
    - --no-enable-flashinfer-autotune
    - --mm-encoder-tp-mode data
    - --reasoning-parser qwen3
    - --tool-call-parser qwen3_xml
    - --enable-auto-tool-choice
    - --compilation-config '{"pass_config":{"fuse_act_quant":true}}'
    - --gpu-memory-utilization 0.8
  env:
    - name: PYTORCH_ALLOC_CONF
      value: "per_process_memory_fraction:0.8"
    - name: VLLM_PLE_TABLE_MEMORY
      value: "disk"
    - name: B12X_DISK_BACKEND
      value: "io_uring"
    - name: CUTE_DSL_ARCH
      value: "sm_121a"
    - name: SAFETENSORS_FAST_GPU
      value: "1"
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: "spawn"
    - name: VLLM_SSM_CONV_STATE_LAYOUT
      value: "DS"
    - name: VLLM_USE_AOT_COMPILE
      value: "1"
    - name: VLLM_USE_MEGA_AOT_ARTIFACT
      value: "1"
    - name: VLLM_USE_V2_MODEL_RUNNER
      value: "1"
    - name: B12X_POLICY_MODE
      value: "auto"
    - name: VLLM_MXFP8_LM_HEAD
      value: "1"
    - name: VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE
      value: "w13"
    - name: VLLM_B12X_MOE_FP4_FORCE_A16
      value: "1"
    - name: B12X_W4A16_A4_PREFILL
      value: "1"
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
