---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
# Model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
# Recipe: nemotron-3-nano-nvfp4.yaml
# Single-node TP=1, NVFP4 quantization, Marlin backend
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: nemotron-3-nano-nvfp4
spec:
  source: hf://nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
  sourceSecretRef:
    name: huggingface
  format: safetensors
  quantization: nvfp4
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
# InferenceService: vLLM serving with NVFP4 + Marlin backend
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: nemotron-3-nano-nvfp4
  labels:
    krr/ignore: "true"
spec:
  modelRef: nemotron-3-nano-nvfp4
  modelCache:
    claimName: llmkube-ganyu-cache
  runtime: vllm
  image: eugr/spark-vllm:latest
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: high
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  maxNumBatchedTokens: 4096
  parallelSlots: 1
  batchSize: 4096
  uBatchSize: 4096
  resources:
    cpu: "1000m"
    memory: "32Gi"
    nvidia.com/gpu: "1"
  endpoint:
    port: 8000
    type: ClusterIP
  extraArgs:
    - --host 0.0.0.0
    - --port 8000
    - --max-model-len 262144
    - --max-num-batched-tokens 4096
    - --max-num-seqs 8
    - --gpu-memory-utilization 0.7
    - --kv-cache-dtype fp8
    - --load-format fastsafetensors
    - --attention-backend flashinfer
    - --enable-prefix-caching
    - --enable-auto-tool-choice
    - --tool-call-parser qwen3_coder
    - --reasoning-parser nano_v3
    - --reasoning-parser-plugin nano_v3_reasoning_parser.py
  env:
    - name: VLLM_USE_FLASHINFER_MOE_FP4
      value: "1"
    - name: VLLM_FLASHINFER_MOE_BACKEND
      value: "throughput"
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
