# Used for Minisforums MS01 control-plane nodes
customization:
  extraKernelArgs:
    - console=ttyS0,115200 # Intel vPro serial
    - i915.enable_guc=3 # Enable GuC and HuC for better graphics performance and stability
    - i915.force_probe=!a7a0 # Disable iGPU deviceID for i915
    - xe.force_probe=a7a0 # Enable iGPU deviceID for xe
    - xe.max_vfs=7 # Enable SR-IOV VF devices

  systemExtensions:
    officialExtensions:
      - siderolabs/gasket-driver # Google Coral driver
      - siderolabs/i915 # Intel iGPU (i915)
      - siderolabs/intel-ucode # Intel iGPU
      - siderolabs/lldpd # lldp
      - siderolabs/mei # Intel iGPU
      - siderolabs/nut-client
      - siderolabs/thunderbolt # Thunderbolt Ports
      - siderolabs/util-linux-tools # Linux Utils
      - siderolabs/xe # Intel iGPU (XE)
