---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/1dd2cbb33be2acbba7cdabb8a08d6b890592afca55e9456ef15b1e22e7003a2e:v1.14.5
provisioning:
  diskSelector:
    match: disk.serial == "22061X806789"
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: ms3
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("58:47:ca:78:f8:4a", mac(link.hardware_addr))
---
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - ethSel0
bondMode: active-backup
mtu: 1500
addresses:
  - address: 10.200.15.53/24
routes:
  - gateway: 10.200.15.1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.200.15.254
link: bond0
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.20
vlanID: 20
parent: bond0
mtu: 1500
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.30
vlanID: 30
parent: bond0
mtu: 1500
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.100
vlanID: 100
parent: bond0
mtu: 1500
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond0.110
vlanID: 110
parent: bond0
mtu: 1500
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - 162.159.200.1
    - 162.159.200.123
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
    fs.inotify.max_user_instances: "8192"
    fs.inotify.max_user_watches: "1048576"
    net.core.rmem_max: "7500000"
    net.core.wmem_max: "7500000"
    net.ipv4.neigh.default.gc_thresh1: "4096"
    net.ipv4.neigh.default.gc_thresh2: "8192"
    net.ipv4.neigh.default.gc_thresh3: "16384"
    net.ipv4.tcp_slow_start_after_idle: "0"
    user.max_user_namespaces: "11255"
