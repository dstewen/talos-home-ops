# Below is the schematic used for the blade
# curl -X POST --data-binary @/home/dstewen/cm4-blade-talos-nut-util-tools.yaml https://factory.talos.dev/schematics
overlay:
  name: rpi_generic
  image: siderolabs/sbc-raspberrypi
  options:
    configTxt: |
      hdmi_force_hotplug:0=1
      kernel=u-boot.bin
      arm_64bit=1
      arm_boost=1
      enable_uart=1
      disable_overscan=1
      device_tree_address=0x1f0000
      device_tree_end=0x200000
      device_tree=bcm2711-rpi-cm4.dtb
      dtoverlay=uart5
      dtoverlay=dwc2,dr_mode=host
      dtoverlay=vc4-kms-v3d-pi4
      dtparam=spi=on
      dtoverlay=disable-bt
      dtoverlay=disable-wifi
      [cm4]
      over_voltage=6
      arm_freq=2000
      gpu_mem=32
customization:
  systemExtensions:
    officialExtensions:
        - siderolabs/util-linux-tools
