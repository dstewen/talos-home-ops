---
# NVIDIA DGX Spark (GB10, arm64, secureboot UKI).
#
# Hardware: NVIDIA GB10 SoC (Grace 12-core ARM64 + Blackwell GPU via C2C),
# 128GB unified memory, 4TB NVMe, 2x Mellanox ConnectX-7 QSFP56 + 1x Realtek
# RTL8127 10G copper.
#
# Driver: Proprietary NVIDIA drivers required. Open-source drivers cause CUDA
# cuInit() error 3. Uses siderolabs/nonfree-kmod-nvidia-production.
#
# Kernel: arm64.nobti required to prevent crashes and CUDA library load failures.
# pci=pcie_bus_safe improves NCCL throughput on ConnectX-7 from ~130-165 Gb/s
# to ~178-189 Gb/s by raising PCIe MaxPayload to match DevCap (512B).
customization:
  extraKernelArgs:
    - arm64.nobti
    - pci=pcie_bus_safe
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools
      - siderolabs/lldpd
      - siderolabs/nvidia-container-toolkit-production
      # Proprietary drivers required for CUDA on DGX Spark (GB10)
      # Open-source drivers cause CUDA initialization failures (cuInit error 3)
      - siderolabs/nonfree-kmod-nvidia-production
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.ipv4.conf.all.arp_ignore: "1"          # RoCE: ARP only on receiving interface
  net.ipv4.conf.all.arp_announce: "2"         # RoCE: respond via best interface for dest
  vm.compaction_proactiveness: "0"            # GB10: disable proactive compaction to avoid GPU stalls on pinned unified memory
